<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OKR 管理平台 - 企业微信登录</title><link rel="icon" href="/static/okr/logo.svg"><link rel="stylesheet" href="/static/okr/okr-common.css?v=20260816-confirm-dialog">
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0f172a 0%,#6d28d9 100%)}
.auth-card{width:440px;max-width:100%;background:#fff;border-radius:18px;padding:38px 36px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.brand{text-align:center;margin-bottom:26px}.brand h1{margin:0;color:#1e293b;font-size:25px}.brand p{margin:8px 0 0;color:#64748b;font-size:14px}.state{text-align:center;padding:24px 4px;color:#475569;line-height:1.8}.spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid #ede9fe;border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.phone-panel{display:none}.phone-panel.show{display:block}.user-tip{margin-bottom:20px;padding:12px 14px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:9px;color:#5b21b6;font-size:14px;line-height:1.6}.form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:7px;color:#334155;font-size:14px;font-weight:600}.form-input{width:100%;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.sms-row{display:flex;gap:10px}.sms-row .form-input{flex:1;min-width:0}button{font-family:inherit}.sms-btn{min-width:116px;padding:0 12px;border:0;border-radius:8px;background:#ede9fe;color:#6d28d9;font-weight:600;cursor:pointer}.sms-btn:disabled{color:#94a3b8;cursor:not-allowed}.submit-btn{width:100%;height:46px;border:0;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.submit-btn:disabled{opacity:.55;cursor:not-allowed}.error{display:none;margin:14px 0;padding:10px 12px;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:7px;font-size:13px;line-height:1.5}.error.show{display:block}.retry{display:inline-block;margin-top:14px;border:0;background:none;color:#6d28d9;cursor:pointer;text-decoration:underline}.security{margin-top:18px;color:#94a3b8;font-size:12px;line-height:1.6;text-align:center}
</style></head><body>
<img src="/static/okr/logo.svg" alt="Logo" style="position:fixed;top:20px;right:28px;height:48px">
<main class="auth-card"><div class="brand"><h1>OKR 管理平台</h1><p>使用企业微信身份安全登录</p></div>
<section id="oauthState" class="state"><div class="spinner"></div><div id="stateText">正在跳转至企业微信授权…</div><div id="oauthError" class="error"></div><button id="retryBtn" class="retry" type="button" style="display:none" onclick="startOAuth()">重新授权</button></section>
<section id="phonePanel" class="phone-panel"><div id="userTip" class="user-tip"></div><form id="phoneForm"><div class="form-group"><label for="phone">手机号码</label><input class="form-input" id="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入本人手机号" required></div><div class="form-group"><label for="code">短信验证码</label><div class="sms-row"><input class="form-input" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6位验证码" required><button class="sms-btn" id="sendBtn" type="button">发送验证码</button></div></div><div id="phoneError" class="error"></div><button class="submit-btn" id="verifyBtn" type="submit">验证并进入 OKR</button></form><div class="security">手机号必须能实际接收腾讯云短信；验证成功后才可访问 OKR 数据。</div></section></main>
<script src="/static/okr/okr-common.js?v=20260816-confirm-dialog"></script><script>

const oauthState=document.getElementById('oauthState'),phonePanel=document.getElementById('phonePanel'),oauthError=document.getElementById('oauthError'),phoneError=document.getElementById('phoneError');let countdownTimer=null;
function showError(el,message){el.textContent=message||'操作失败';el.classList.add('show')}function clearError(el){el.textContent='';el.classList.remove('show')}
async function request(path,options={}){const headers={'Content-Type':'application/json'},token=getToken();if(token)headers.Authorization='Bearer '+token;const response=await fetch(path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):undefined});let data={};try{data=await response.json()}catch(_){}if(!response.ok)throw new Error(data.detail||data.msg||('请求失败（'+response.status+'）'));return data}
function tokenFromHash(){const params=new URLSearchParams(location.hash.slice(1)),token=params.get('wecom_token');if(!token)return'';history.replaceState(null,'','/okr/login');return token}
async function startOAuth(){clearAuth();clearError(oauthError);document.getElementById('retryBtn').style.display='none';document.getElementById('stateText').textContent='正在跳转至企业微信授权…';try{const options=await request('/api/okr/auth/wecom/options');if(!options.enabled||!options.configured)throw new Error('OKR 企业微信登录尚未完成服务器配置，请联系管理员');location.replace('/api/okr/auth/wecom/start?mode=auto')}catch(error){document.querySelector('.spinner').style.display='none';document.getElementById('stateText').textContent='暂时无法发起企业微信登录';showError(oauthError,error.message);document.getElementById('retryBtn').style.display='inline-block'}}
async function continueAfterOAuth(){try{const user=await request('/api/okr/auth/me');setUser(user);if(user.phone_verified){location.replace('/okr');return}if(!user.is_wecom)throw new Error('当前账号不是企业微信授权账号');oauthState.style.display='none';phonePanel.classList.add('show');document.getElementById('userTip').textContent=user.name+'，企业微信身份已确认。首次进入必须短信验证手机号。';if(user.phone)document.getElementById('phone').value=user.phone}catch(error){clearAuth();showError(oauthError,error.message);document.querySelector('.spinner').style.display='none';document.getElementById('stateText').textContent='企业微信登录未完成';document.getElementById('retryBtn').style.display='inline-block'}}
function beginCountdown(seconds){const button=document.getElementById('sendBtn');let left=seconds;button.disabled=true;button.textContent=left+' 秒';clearInterval(countdownTimer);countdownTimer=setInterval(()=>{left-=1;button.textContent=left+' 秒';if(left<=0){clearInterval(countdownTimer);button.disabled=false;button.textContent='发送验证码'}},1000)}

document.getElementById('sendBtn').addEventListener('click',async()=>{clearError(phoneError);const phone=document.getElementById('phone').value.trim();if(!/^1\d{10}$/.test(phone)){showError(phoneError,'请输入正确的11位手机号');return}const button=document.getElementById('sendBtn');button.disabled=true;button.textContent='发送中…';try{const result=await request('/api/okr/auth/phone/send',{method:'POST',body:{phone}});beginCountdown(result.expires_in?Math.min(60,result.expires_in):60)}catch(error){button.disabled=false;button.textContent='发送验证码';showError(phoneError,error.message)}});
document.getElementById('phoneForm').addEventListener('submit',async event=>{event.preventDefault();clearError(phoneError);const phone=document.getElementById('phone').value.trim(),code=document.getElementById('code').value.trim();if(!/^1\d{10}$/.test(phone)||!/^\d{6}$/.test(code)){showError(phoneError,'请输入正确的手机号和6位验证码');return}const button=document.getElementById('verifyBtn');button.disabled=true;button.textContent='验证中…';try{const result=await request('/api/okr/auth/phone/verify',{method:'POST',body:{phone,code}});setToken(result.token);setUser(result.user);location.replace('/okr')}catch(error){button.disabled=false;button.textContent='验证并进入 OKR';showError(phoneError,error.message)}});
(async function init(){const callbackToken=tokenFromHash();if(callbackToken)setToken(callbackToken);if(getToken()){await refreshLegacyRoleToken();await continueAfterOAuth()}else await startOAuth()})();
async function refreshLegacyRoleToken(){
  const payload=getTokenPayload();
  if(!payload||payload.role!=='superAdmin'||payload.active_role)return;
  const user=await request('/api/okr/auth/me');
  if(!user.phone_verified)return;
  if(!['dept_head','superAdmin'].includes(user.role))return;
  const result=await request('/api/okr/auth/role',{method:'POST',body:{role:user.role}});
  setToken(result.token);
  setUser(result.user);
}
</script></body></html>
