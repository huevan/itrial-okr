version: 1

project:
  name: "iTrial OKR"
  profile: "generic"
  architecture_style: modular-monolith

paths:
  backend_source: "okr"
  backend_modules: "okr"
  frontend_source: "static/okr"
  frontend_features: "static/okr"
  shared_code: []
  canonical_style_root: "static/okr/okr-common.css"
  migrations: "okr/db.py:init_db (existing idempotent SQLite migrations)"

entrypoints:
  backend: "app.py:app"
  frontend: "static/okr/index.html"

commands:
  format_check: "python scripts/verify.py --static-only"
  lint: "python scripts/verify.py --static-only"
  type_check: "python scripts/verify.py --static-only (syntax and import-boundary checks; legacy code has no strict typing baseline)"
  focused_tests: "python -m unittest discover -s tests -p test_okr*.py"
  full_tests: "python scripts/verify.py"
  production_build: "docker build -t itrial-okr ."
  architecture_check: "python scripts/architecture_guard.py"
  dependency_integrity: "python -m pip check"
  secret_scan: "python scripts/secret_scan.py"

contracts:
  module_public_surface: "okr/public.py; root okr_*.py are import aliases only"
  api_contract_location: "GET /openapi.json; existing /api/okr/* and /okr routes"
  error_shape: "FastAPI HTTPException detail; existing Pydantic 422 validation"

environments:
  local_runtime: "uvicorn app:app --host 127.0.0.1 --port 8888; docker compose up --build"
  secret_reference_mechanism: "ignored config.json generated by scripts/setup.py; existing provider environment variables"
  remote_deployment_requires_explicit_authorization: true
